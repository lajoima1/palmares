<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--herb-->
  <!-- Makes the Cloudflare site installable on Android, in both looks. The status bar follows the system appearance. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#F4F5F2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0F1412" media="(prefers-color-scheme: dark)" />
  <style>
    /* The new look's loader (mockup A). vite.config.ts removes each herb block from the GitHub Pages build. */
    .herb-loader {
      display: none;
    }

    html.herb #initial-loader {
      --ground: #F4F5F2;
      --ink: #16201B;
      --line: #E1E5E0;
      --herb: #2E6A4C;
      --on-herb: #FFFFFF;
      background-color: var(--ground);
      color: var(--ink);
    }

    html.herb.herb-dark #initial-loader {
      --ground: #0F1412;
      --ink: #E8EEEA;
      --line: #2A3530;
      --herb: #7CC9A0;
      --on-herb: #0F1412;
    }

    html.herb #initial-loader > :not(.herb-loader) {
      display: none;
    }

    html.herb .herb-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding-bottom: 64px;
    }

    .herb-mark {
      width: 76px;
      height: 76px;
      border-radius: 23px;
      background: var(--herb);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .herb-leaf {
      fill: var(--on-herb);
    }

    .herb-vein {
      stroke: var(--herb);
    }

    .herb-stem {
      stroke: var(--on-herb);
    }

    .herb-mark svg {
      transform-origin: 22% 82%;
      animation: herb-sway 2.4s ease-in-out infinite;
    }

    .herb-name {
      font: 800 34px/1 "Bricolage Grotesque", system-ui, sans-serif;
      letter-spacing: -0.02em;
      opacity: 0;
      transition: opacity 0.2s;
    }

    html.herb-font .herb-name {
      opacity: 1;
    }

    .herb-bar {
      width: 120px;
      height: 4px;
      margin-top: 4px;
      border-radius: 2px;
      background: var(--line);
      overflow: hidden;
    }

    .herb-bar span {
      display: block;
      width: 40%;
      height: 4px;
      border-radius: 2px;
      background: var(--herb);
      animation: herb-slide 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes herb-sway {
      0%, 100% {
        transform: rotate(-7deg);
      }

      50% {
        transform: rotate(7deg);
      }
    }

    @keyframes herb-slide {
      from {
        transform: translateX(-100%);
      }

      to {
        transform: translateX(250%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .herb-mark svg,
      .herb-bar span {
        animation: none;
      }
    }
  </style>
  <script>
    // Runs before the body paints, so a device on the new look never sees the garlic loader.
    // The same rules as getLook() and getAppearance() in src/look.ts.
    (function () {
      var look = null;
      var appearance = null;
      try {
        look = localStorage.getItem('look');
        appearance = localStorage.getItem('appearance');
      } catch (error) {
        // No storage: the defaults apply.
      }
      if (look === 'old') return;
      var root = document.documentElement;
      var dark = appearance === 'dark' ||
        (appearance !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.classList.add('herb');
      if (dark) root.classList.add('herb-dark');

      var showName = function () {
        root.classList.add('herb-font');
      };
      // Show the name in its own font, or in the fallback font if the font is slow.
      setTimeout(showName, 1500);
      var fonts = document.createElement('link');
      fonts.rel = 'stylesheet';
      fonts.href = 'https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap';
      fonts.onload = function () {
        if (document.fonts) document.fonts.load('800 34px "Bricolage Grotesque"').then(showName, showName);
        else showName();
      };
      document.head.appendChild(fonts);

      var base = '%BASE_URL%';
      var icon = document.querySelector('link[rel="icon"]');
      icon.type = 'image/png';
      icon.sizes = '32x32';
      icon.href = base + 'icon-32.png';
      [['icon', 'icon.svg', 'image/svg+xml'], ['apple-touch-icon', 'apple-touch-icon.png', '']].forEach(function (item) {
        var link = document.createElement('link');
        link.rel = item[0];
        link.href = base + item[1];
        if (item[2]) link.type = item[2];
        document.head.appendChild(link);
      });
    })();
  </script>
  <!--/herb-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <title>Palmarès</title>
  <style>
    body {
      background-color: transparent;
    }

    /* Initial loading screen styles */
    #initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
      z-index: 9999;
    }

    @media (prefers-color-scheme: dark) {
      #initial-loader {
        background-color: #1e1e1e;
        color: #e0e0e0;
      }
    }

    .spinner {
      width: 80px;
      height: 80px;
      border: 4px solid rgba(0, 0, 0, 0.08);
      border-left: 4px solid #1976d2;
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
      position: relative;
    }

    @media (prefers-color-scheme: dark) {
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.08);
        border-left: 4px solid #1976d2;
      }
    }

    .spinner::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background-image: url('/squared-garlic-64x64.webp');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }

    .loading-title {
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 8px 0;
      color: #1976d2;
    }

    .loading-subtitle {
      font-size: 16px;
      margin: 0;
      color: #757575;
    }

    @media (prefers-color-scheme: dark) {
      .loading-subtitle {
        color: #bdbdbd;
      }
    }

    /* Hide the loader once React loads */
    .react-loaded #initial-loader {
      display: none;
    }
  </style>
</head>

<body>
  <div id="initial-loader">
    <!--herb-->
    <div class="herb-loader" role="status" aria-label="Loading recipes">
      <span class="herb-mark">
        <svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 20C4 11 10 5 20 5c0 10-6 15.5-15 15z" class="herb-leaf" />
          <path d="M8.5 16.5l6.5-6.5" class="herb-vein" stroke-width="1.6" stroke-linecap="round" />
          <path d="M5.6 19.4l-2.2 2.2" class="herb-stem" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </span>
      <span class="herb-name">Palmarès</span>
      <span class="herb-bar" aria-hidden="true"><span></span></span>
    </div>
    <!--/herb-->
    <div class="spinner"></div>
    <div class="loading-text">
      <h1 class="loading-title">Palmarès</h1>
      <p class="loading-subtitle">Loading application...</p>
    </div>
  </div>

  <div id="root" style="width: 100%"></div>

  <script type="module" src="/src/main.tsx"></script>

  <script>
    // Set dynamic spinner color based on user's theme preference
    function setSpinnerColor() {
      try {
        // The new look draws its own loader (the head script sets this class).
        if (document.documentElement.classList.contains('herb')) return;
        const colorThemes = [
          { name: "Parchment", primary: "#8B4513", secondary: "#D2691E" },
          { name: "Classic Red", primary: "#d32f2f", secondary: "#ff9800" },
          { name: "Ocean Blue", primary: "#1976d2", secondary: "#ff9800" },
          { name: "Forest Green", primary: "#388e3c", secondary: "#ff7043" },
          { name: "Royal Purple", primary: "#7b1fa2", secondary: "#ffc107" },
          { name: "Sunset Orange", primary: "#f57c00", secondary: "#e91e63" }
        ];

        const savedTheme = localStorage.getItem('color-theme');
        const currentTheme = savedTheme ? JSON.parse(savedTheme) : colorThemes[0]; // Default to Parchment

        // Get user's dark mode preference
        const savedDarkMode = localStorage.getItem('theme-mode');
        const isDarkMode = savedDarkMode ? JSON.parse(savedDarkMode) : window.matchMedia('(prefers-color-scheme: dark)').matches;

        // Set theme-based colors
        const isParchment = currentTheme.name === "Parchment";
        const backgroundColor = isParchment
          ? (isDarkMode ? '#2C2416' : '#F4E8D0')
          : (isDarkMode ? '#121212' : '#fafafa');
        const textColor = isParchment
          ? (isDarkMode ? '#E8D5B7' : '#3E2723')
          : (isDarkMode ? '#ffffff' : '#000000');
        const subtitleColor = isParchment
          ? (isDarkMode ? '#C4A882' : '#5D4037')
          : (isDarkMode ? '#bdbdbd' : '#757575');
        const spinnerBorder = isDarkMode ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.08)';

        // Create a style element to override the colors
        const style = document.createElement('style');
        style.textContent = `
          #initial-loader {
            background-color: ${backgroundColor} !important;
            color: ${textColor} !important;
          }
          .spinner {
            border: 4px solid ${spinnerBorder} !important;
            border-left-color: ${currentTheme.primary} !important;
          }
          .loading-title {
            color: ${currentTheme.primary} !important;
          }
          .loading-subtitle {
            color: ${subtitleColor} !important;
          }
        `;
        document.head.appendChild(style);
      } catch (error) {
        console.log('Could not load theme preference, using default');
      }
    }

    // Set spinner color immediately
    setSpinnerColor();

    // Hide the initial loader once React starts rendering
    window.addEventListener('DOMContentLoaded', function () {
      // Add a small delay to ensure smooth transition
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          document.body.classList.add('react-loaded');
        } else {
          // Check again after a short delay if React hasn't loaded yet
          const checkReactLoaded = () => {
            if (root && root.children.length > 0) {
              document.body.classList.add('react-loaded');
            } else {
              setTimeout(checkReactLoaded, 100);
            }
          };
          checkReactLoaded();
        }
      }, 300);
    });
  </script>
</body>

</html>
